<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TanukiFamily | Гастропаспорт</title>
    <style>
        /* === БАЗОВЫЕ СТИЛИ === */
        :root {
            --tanuki-red: #e31e24;
            --tanuki-dark: #1a1a1a;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --success: #4caf50;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-family);
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Имитация мобильного экрана */
        #app {
            width: 100%;
            max-width: 430px;
            height: 100%;
            background-color: var(--card-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .screen { display: none; padding: 20px; min-height: 100%; flex-direction: column; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn { background: var(--tanuki-red); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; text-align: center; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: var(--bg-color); color: var(--tanuki-dark); border: 1px solid var(--border-color); }

        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 14px; line-height: 1.5; color: var(--text-muted); margin-bottom: 10px; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 10px; }
        .header-title { font-weight: bold; font-size: 18px; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-main); }

        /* Экран Приветствия */
        #screen-welcome { justify-content: center; align-items: center; text-align: center; background: linear-gradient(135deg, #fff 0%, #ffe5e5 100%); }
        .welcome-icon { font-size: 60px; margin-bottom: 20px; }
        
        /* Главный экран */
        .progress-container { margin-bottom: 20px; }
        .progress-bar { height: 8px; background: var(--bg-color); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--tanuki-red); width: 0%; transition: width 0.5s ease; }
        
        .steps-list { display: flex; flex-direction: column; gap: 12px; }
        .step-card { display: flex; align-items: center; padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); background: var(--card-bg); }
        .step-card.locked { opacity: 0.6; }
        .step-card.active-step { border-color: var(--tanuki-red); box-shadow: 0 4px 12px rgba(227, 30, 36, 0.1); }
        .step-card.completed { background: #f0fdf4; border-color: var(--success); }
        
        .step-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-color); display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 20px; }
        .step-info { flex: 1; }
        .step-name { font-weight: 600; font-size: 16px; }
        .step-status { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        
        /* Меню */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .product-card { background: var(--bg-color); border-radius: 12px; overflow: hidden; padding: 10px; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 120px; background: #ddd; border-radius: 8px; object-fit: cover; margin-bottom: 10px; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .product-price { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .add-btn { background: white; border: 1px solid var(--tanuki-red); color: var(--tanuki-red); border-radius: 8px; padding: 8px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; }

        /* Корзина и Форма */
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border-color); }
        .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin: 20px 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 16px; }
        
        /* Заказы */
        .order-card { background: var(--bg-color); padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .order-status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .status-delivered { background: #dcfce7; color: #166534; }
        .status-pending { background: #fef9c3; color: #854d0e; }

        /* Админка */
        #admin-panel { background: #1e1e1e; color: white; padding: 20px; display: none; z-index: 100; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; }
        #admin-panel.active { display: block; }
        .admin-section { background: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .admin-btn { background: #4a4a4a; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 5px; width: 100%; text-align: left;}
        .admin-btn:hover { background: #666; }
    </style>
</head>
<body>

<div id="app">
    <!-- Экран 1: Приветствие -->
    <div id="screen-welcome" class="screen active">
        <div class="welcome-icon">🍣</div>
        <h1>Собери Гастропаспорт</h1>
        <p>Попадёшь на секретный ужин!</p>
        <p style="margin-bottom: 30px;">Заказывай в 5 заведениях, собирай отметки и получай доступ к закрытому мероприятию.</p>
        <button class="btn" onclick="App.startApp()">Начать</button>
    </div>

    <!-- Экран 2: Гастропаспорт -->
    <div id="screen-passport" class="screen">
        <div class="header">
            <div class="header-title">Гастропаспорт</div>
            <div style="font-size: 12px; color: var(--tanuki-red); cursor: pointer; font-weight:bold;" onclick="App.goTo('profile')">Мои заказы</div>
        </div>
        
        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
                <span>Прогресс</span>
                <span id="passport-progress-text">0 из 5</span>
            </div>
            <div class="progress-bar"><div id="passport-progress-fill" class="progress-fill"></div></div>
        </div>

        <div id="steps-container" class="steps-list"></div>
        
        <div id="event-block" style="margin-top: 20px; display: none;">
            <button class="btn" onclick="App.goTo('events')">Перейти к мероприятиям</button>
        </div>
    </div>

    <!-- Экран 3: Партнер -->
    <div id="screen-partner" class="screen">
        <div class="header">
            <button class="back-btn" onclick="App.goTo('passport')">←</button>
            <div class="header-title" id="partner-title">Загрузка...</div>
            <div style="width: 24px;"></div>
        </div>
        <p id="partner-desc"></p>
        <div class="menu-grid" id="partner-menu"></div>
    </div>

    <!-- Экран 4: Корзина -->
    <div id="screen-cart" class="screen">
        <div class="header">
            <button class="back-btn" onclick="App.goTo('partner')">←</button>
            <div class="header-title">Корзина</div>
            <div style="width: 24px;"></div>
        </div>
        <div id="cart-items"></div>
        <div class="cart-total">
            <span>Итого:</span>
            <span id="cart-total-price">0 ₽</span>
        </div>
        <button class="btn" onclick="App.goTo('checkout')">Оформить заказ</button>
    </div>

    <!-- Экран 5: Оформление -->
    <div id="screen-checkout" class="screen">
        <div class="header">
            <button class="back-btn" onclick="App.goTo('cart')">←</button>
            <div class="header-title">Оформление</div>
            <div style="width: 24px;"></div>
        </div>
        <div class="form-group">
            <label>Имя</label>
            <input type="text" id="order-name" placeholder="Иван" required>
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="order-phone" placeholder="+7 (999) 000-00-00" required>
        </div>
        <div class="form-group">
            <label>Адрес доставки</label>
            <input type="text" id="order-address" placeholder="ул. Пушкина, д. 1" required>
        </div>
        <button class="btn" onclick="App.submitOrder()">Подтвердить заказ</button>
    </div>

    <!-- Экран 6: Профиль -->
    <div id="screen-profile" class="screen">
        <div class="header">
            <button class="back-btn" onclick="App.goTo('passport')">←</button>
            <div class="header-title">Мои заказы</div>
            <div style="width: 24px;"></div>
        </div>
        <div id="orders-list"></div>
        <button class="btn btn-secondary" style="margin-top: 20px;" onclick="App.openAdmin()">Панель Управления (Demo)</button>
    </div>

    <!-- Экран 7: Мероприятия -->
    <div id="screen-events" class="screen">
        <div class="header">
            <button class="back-btn" onclick="App.goTo('passport')">←</button>
            <div class="header-title">Секретные ужины</div>
            <div style="width: 24px;"></div>
        </div>
        <div id="events-list"></div>
    </div>

    <!-- Админка -->
    <div id="admin-panel">
        <h2 style="color: white; margin-bottom: 20px;">Admin Panel (Demo)</h2>
        <div class="admin-section">
            <h3>Заказы</h3>
            <div id="admin-orders"></div>
        </div>
        <div class="admin-section">
            <h3>Сброс данных</h3>
            <button class="admin-btn" style="background: #e31e24;" onclick="App.resetAllData()">ПОЛНЫЙ СБРОС</button>
        </div>
        <button class="admin-btn" onclick="App.closeAdmin()" style="margin-top: 20px; text-align:center;">Закрыть панель</button>
    </div>
</div>

<script>
    // === КОНФИГУРАЦИЯ ===
    const CONFIG = {
        partners: [
            { id: 'tanuki', name: 'Тануки', desc: 'Первый заказ. Попробуйте наш фирменный ролл!', logo: '🍣', menu: [ { id: 't1', name: 'Ролл Карамельный угорь', price: 835, img: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=300&h=200&fit=crop' } ] },
            { id: 'pizza', name: 'TVOЯ Pizza', desc: 'Итальянская пицца на тонком тесте.', logo: '🍕', menu: [ { id: 'p1', name: 'Пицца Креветка Итальяно', price: 920, img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300&h=200&fit=crop' } ] },
            { id: 'caspiyka', name: 'Каспийка', desc: 'Аутентичная каспийская кухня.', logo: '🐟', menu: [ { id: 'c1', name: 'Уха по-каспийски', price: 595, img: 'https://images.unsplash.com/photo-1547592180-85f173990554?w=300&h=200&fit=crop' } ] },
            { id: 'ers', name: 'Ёрш', desc: 'Домашняя кухня и сливочные соусы.', logo: '🍲', menu: [ { id: 'e1', name: 'Курица в сливочном соусе', price: 690, img: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=300&h=200&fit=crop' } ] },
            { id: 'tanuki_surprise', name: 'Сюрприз от Тануки', desc: 'Специальное предложение.', logo: '🎁', menu: [ { id: 't2', name: 'Суп Тануки-ям', price: 680, img: 'https://images.unsplash.com/photo-1548943487-a2e4b6bfb6d3?w=300&h=200&fit=crop' } ] }
        ]
    };

    // === БАЗА ДАННЫХ ===
    const DB = {
        get: (key) => JSON.parse(localStorage.getItem(`tanuki_${key}`)),
        set: (key, val) => localStorage.setItem(`tanuki_${key}`, JSON.stringify(val)),
        init: () => {
            if (!DB.get('user')) {
                DB.set('user', { started: false, currentStep: 0, marks: 0, orders: [], cart: [], activePartnerId: null });
            }
        }
    };
    DB.init();

    // === ЛОГИКА ===
    const App = {
        user: DB.get('user'),

        goTo: (screenId) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screenId}`).classList.add('active');
            if(screenId === 'passport') App.renderPassport();
            if(screenId === 'profile') App.renderOrders();
            if(screenId === 'cart') App.renderCart();
        },

        startApp: () => {
            App.user.started = true;
            DB.set('user', App.user);
            App.goTo('passport');
        },

        renderPassport: () => {
            const container = document.getElementById('steps-container');
            const progressText = document.getElementById('passport-progress-text');
            const progressFill = document.getElementById('passport-progress-fill');
            const eventBlock = document.getElementById('event-block');

            progressText.innerText = `${App.user.marks} из 5`;
            progressFill.style.width = `${(App.user.marks / 5) * 100}%`;

            if(App.user.marks >= 5) eventBlock.style.display = 'block';

            container.innerHTML = CONFIG.partners.map((p, index) => {
                let statusClass = 'locked';
                let statusText = 'Скоро откроется';
                
                if (index < App.user.currentStep) {
                    statusClass = 'completed';
                    statusText = 'Отметка получена';
                } else if (index === App.user.currentStep) {
                    statusClass = 'active-step';
                    statusText = 'Доступен для заказа';
                }

                return `
                    <div class="step-card ${statusClass}" onclick="${index === App.user.currentStep ? `App.openPartner('${p.id}')` : ''}">
                        <div class="step-icon">${p.logo}</div>
                        <div class="step-info">
                            <div class="step-name">${p.name}</div>
                            <div class="step-status">${statusText}</div>
                        </div>
                    </div>
                `;
            }).join('');
        },

        openPartner: (partnerId) => {
            const partner = CONFIG.partners.find(p => p.id === partnerId);
            App.user.activePartnerId = partnerId;
            DB.set('user', App.user);

            document.getElementById('partner-title').innerText = partner.name;
            document.getElementById('partner-desc').innerText = partner.desc;
            
            document.getElementById('partner-menu').innerHTML = partner.menu.map(item => `
                <div class="product-card">
                    <img src="${item.img}" class="product-img" alt="${item.name}">
                    <div class="product-title">${item.name}</div>
                    <div class="product-price">${item.price} ₽</div>
                    <button class="add-btn" onclick="App.addToCart('${partnerId}', '${item.id}')">В корзину</button>
                </div>
            `).join('');

            App.goTo('partner');
        },

        addToCart: (partnerId, itemId) => {
            const partner = CONFIG.partners.find(p => p.id === partnerId);
            const item = partner.menu.find(i => i.id === itemId);
            
            const existing = App.user.cart.find(c => c.id === itemId);
            if (existing) existing.qty += 1;
            else App.user.cart.push({ ...item, qty: 1, partnerId });
            
            DB.set('user', App.user);
            App.goTo('cart'); // Автоматический переход в корзину
        },

        renderCart: () => {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total-price');
            
            if (App.user.cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; margin-top:50px;">Корзина пуста</p>';
                totalEl.innerText = '0 ₽';
                return;
            }

            let total = 0;
            container.innerHTML = App.user.cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="font-size:12px; color:#888;">${item.qty} шт.</div>
                        </div>
                        <div>${item.price * item.qty} ₽</div>
                    </div>
                `;
            }).join('');
            totalEl.innerText = `${total} ₽`;
        },

        submitOrder: () => {
            const name = document.getElementById('order-name').value;
            const phone = document.getElementById('order-phone').value;
            const address = document.getElementById('order-address').value;

            if(!name || !phone || !address) {
                alert('Заполните все поля');
                return;
            }

            const newOrder = {
                id: 'ORD-' + Math.floor(Math.random() * 10000),
                partnerId: App.user.activePartnerId,
                total: App.user.cart.reduce((acc, item) => acc + (item.price * item.qty), 0),
                status: 'Принят',
            };

            App.user.orders.push(newOrder);
            App.user.cart = [];
            DB.set('user', App.user);
            
            alert('Заказ оформлен! Теперь переведите его в статус "Доставлен" в Панели Управления.');
            App.goTo('profile');
        },

        renderOrders: () => {
            const container = document.getElementById('orders-list');
            if (App.user.orders.length === 0) {
                container.innerHTML = '<p>У вас пока нет заказов.</p>';
                return;
            }

            container.innerHTML = App.user.orders.map(order => `
                <div class="order-card">
                    <div style="font-weight:bold;">Заказ №${order.id}</div>
                    <div class="order-status ${order.status === 'Доставлен' ? 'status-delivered' : 'status-pending'}">${order.status}</div>
                </div>
            `).join('');
        },

        openAdmin: () => {
            document.getElementById('admin-panel').classList.add('active');
            App.renderAdminOrders();
        },
        
        closeAdmin: () => document.getElementById('admin-panel').classList.remove('active'),

        renderAdminOrders: () => {
            const container = document.getElementById('admin-orders');
            if (App.user.orders.length === 0) {
                container.innerHTML = '<p style="color:#aaa;">Нет заказов</p>';
                return;
            }
            
            container.innerHTML = App.user.orders.map(order => `
                <div style="border-bottom:1px solid #444; padding: 10px 0;">
                    <div>${order.id} (${order.status})</div>
                    ${order.status !== 'Доставлен' ? `<button class="admin-btn" onclick="App.adminDeliverOrder('${order.id}')">Доставить</button>` : ''}
                </div>
            `).join('');
        },

        adminDeliverOrder: (orderId) => {
            const order = App.user.orders.find(o => o.id === orderId);
            if (!order || order.status === 'Доставлен') return;

            order.status = 'Доставлен';
            
            const partnerIndex = CONFIG.partners.findIndex(p => p.id === order.partnerId);
            
            if (partnerIndex === App.user.currentStep) {
                App.user.marks += 1;
                App.user.currentStep += 1;
                alert(`Отметка получена! Прогресс: ${App.user.marks}/5`);
            }

            DB.set('user', App.user);
            App.renderAdminOrders();
            App.renderPassport();
        },

        resetAllData: () => {
            if(confirm('Сбросить весь прогресс?')) {
                localStorage.removeItem('tanuki_user');
                location.reload();
            }
        }
    };

    // Запуск
    if (DB.get('user').started) {
        App.goTo('passport');
    }
</script>
</body>
</html>
